app-id: io.github.christiaanbruinsma.DataInspector.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: data-inspector

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Development-only: allow Cargo to resolve dependencies for the first compile gate.
    # Vendor dependencies before a release build.
    - --share=network
  env:
    CARGO_HOME: /run/build/data-inspector/cargo-home

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: data-inspector
    buildsystem: meson
    config-opts:
      - -Dprofile=development
    sources:
      - type: dir
        path: .
