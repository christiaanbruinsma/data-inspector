app-id: io.github.christiaanbruinsma.DataInspector
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: data-inspector
separate-locales: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Release-candidate build: allow Cargo dependency resolution.
    # Vendor dependencies before publishing to a build service that forbids network access.
    - --share=network
  env:
    CARGO_HOME: /run/build/data-inspector/cargo-home

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: data-inspector
    buildsystem: meson
    config-opts:
      - -Dprofile=default
    sources:
      - type: dir
        path: .
