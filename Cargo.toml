[package]
name = "data-inspector"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Inspect structured data files locally in a clear, readable view"

[lib]
name = "data_inspector"
path = "src/lib.rs"

[[bin]]
name = "data-inspector"
path = "src/main.rs"

[dependencies]
csv = "1"
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
serde_json = "1.0"
